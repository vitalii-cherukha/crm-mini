<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Міні-CRM</title>
    <script>
      // Застосовує збережену тему до <html> ще до першого рендеру React,
      // щоб уникнути "спалаху" світлої теми при завантаженні. Ключ
      // localStorage має збігатись з STORAGE_KEY у src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("crm-mini-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
